<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">Laopu Gold research-period price move</title>
  <desc id="desc">A stylized chart showing Laopu Gold rising from around HKD 230 during the research period to HKD 743 by April 2025.</desc>
  <rect width="960" height="600" fill="#ffffff"/>
  <rect x="72" y="66" width="812" height="420" rx="18" fill="#f5f6f7" stroke="#d9dde2" stroke-width="3"/>
  <g stroke="#ffffff" stroke-width="2">
    <line x1="126" y1="410" x2="830" y2="410"/>
    <line x1="126" y1="330" x2="830" y2="330"/>
    <line x1="126" y1="250" x2="830" y2="250"/>
    <line x1="126" y1="170" x2="830" y2="170"/>
    <line x1="126" y1="90" x2="830" y2="90"/>
  </g>
  <g stroke="#7d838c" stroke-width="6" stroke-linecap="round">
    <line x1="168" y1="394" x2="168" y2="346"/>
    <line x1="276" y1="354" x2="276" y2="284"/>
    <line x1="384" y1="304" x2="384" y2="220"/>
    <line x1="492" y1="256" x2="492" y2="176"/>
    <line x1="600" y1="210" x2="600" y2="120"/>
    <line x1="708" y1="162" x2="708" y2="82"/>
  </g>
  <g fill="#cf75c6">
    <rect x="152" y="366" width="32" height="26" rx="4"/>
    <rect x="260" y="310" width="32" height="44" rx="4"/>
    <rect x="368" y="244" width="32" height="58" rx="4"/>
    <rect x="476" y="198" width="32" height="52" rx="4"/>
    <rect x="584" y="146" width="32" height="62" rx="4"/>
    <rect x="692" y="104" width="32" height="54" rx="4"/>
  </g>
  <path d="M168 376 C246 338 300 326 384 270 S514 214 600 176 S674 142 708 126" fill="none" stroke="#7d838c" stroke-width="9" stroke-linecap="round"/>
  <g font-family="Kanit, Microsoft YaHei, Noto Sans SC, sans-serif">
    <text x="118" y="522" fill="#34363c" font-size="20">Nov 2024</text>
    <text x="674" y="522" fill="#34363c" font-size="20">Apr 2025</text>
    <text x="116" y="376" fill="#cf75c6" font-size="24" font-weight="700">~HK$230</text>
    <text x="666" y="92" fill="#cf75c6" font-size="24" font-weight="700">HK$743</text>
    <text x="72" y="562" fill="#cf75c6" font-size="26" font-weight="700">Laopu Gold during the research window</text>
    <text x="72" y="588" fill="#34363c" font-size="15">Illustrative reconstruction from the report note.</text>
  </g>
</svg>
