<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Axe personal investment research agent</title>
  <desc id="desc">A public overview of a personal investment research loop from stock selection to entry, position management, and review reports.</desc>
  <rect width="1200" height="720" fill="#f7f8fa"/>
  <rect x="38" y="38" width="1124" height="644" rx="22" fill="#ffffff" stroke="#d8dde3" stroke-width="2"/>
  <g font-family="Arial, sans-serif">
    <text x="78" y="104" fill="#15171a" font-size="34" font-weight="800">AXE</text>
    <text x="78" y="136" fill="#7f8791" font-size="17">PERSONAL INVESTMENT RESEARCH AGENT</text>
    <rect x="916" y="82" width="190" height="44" rx="22" fill="#c86bc1"/>
    <text x="1011" y="110" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">RESEARCH → DECISION</text>

    <line x1="142" y1="344" x2="1058" y2="344" stroke="#d8dde3" stroke-width="4"/>
    <g fill="#c86bc1">
      <circle cx="188" cy="344" r="10"/><circle cx="462" cy="344" r="10"/><circle cx="736" cy="344" r="10"/><circle cx="1010" cy="344" r="10"/>
    </g>

    <g transform="translate(78 190)">
      <rect width="220" height="280" rx="12" fill="#f4f5f7" stroke="#d8dde3" stroke-width="2"/>
      <text x="24" y="40" fill="#c05ab8" font-size="15" font-weight="700">01 · SELECT</text>
      <text x="24" y="80" fill="#15171a" font-size="27" font-weight="800">选股研究</text>
      <text x="24" y="118" fill="#626a74" font-size="16">产业链位置</text>
      <text x="24" y="148" fill="#626a74" font-size="16">公司与行业证据</text>
      <text x="24" y="178" fill="#626a74" font-size="16">多头 / 空头假设</text>
      <rect x="24" y="218" width="172" height="34" rx="17" fill="#15171a"/>
      <text x="110" y="240" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">BUILD THE WATCHLIST</text>
    </g>

    <g transform="translate(352 190)">
      <rect width="220" height="280" rx="12" fill="#f4f5f7" stroke="#d8dde3" stroke-width="2"/>
      <text x="24" y="40" fill="#c05ab8" font-size="15" font-weight="700">02 · ENTER</text>
      <text x="24" y="80" fill="#15171a" font-size="27" font-weight="800">入场判断</text>
      <text x="24" y="118" fill="#626a74" font-size="16">投资假设确认</text>
      <text x="24" y="148" fill="#626a74" font-size="16">市场状态观察</text>
      <text x="24" y="178" fill="#626a74" font-size="16">价格行为验证</text>
      <rect x="24" y="218" width="172" height="34" rx="17" fill="#15171a"/>
      <text x="110" y="240" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">WAIT FOR ALIGNMENT</text>
    </g>

    <g transform="translate(626 190)">
      <rect width="220" height="280" rx="12" fill="#f4f5f7" stroke="#d8dde3" stroke-width="2"/>
      <text x="24" y="40" fill="#c05ab8" font-size="15" font-weight="700">03 · MANAGE</text>
      <text x="24" y="80" fill="#15171a" font-size="27" font-weight="800">仓位管理</text>
      <text x="24" y="118" fill="#626a74" font-size="16">证据强度变化</text>
      <text x="24" y="148" fill="#626a74" font-size="16">波动与组合风险</text>
      <text x="24" y="178" fill="#626a74" font-size="16">持仓持续验证</text>
      <rect x="24" y="218" width="172" height="34" rx="17" fill="#15171a"/>
      <text x="110" y="240" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">SIZE THE CONVICTION</text>
    </g>

    <g transform="translate(900 190)">
      <rect width="220" height="280" rx="12" fill="#f4f5f7" stroke="#d8dde3" stroke-width="2"/>
      <text x="24" y="40" fill="#c05ab8" font-size="15" font-weight="700">04 · REVIEW</text>
      <text x="24" y="80" fill="#15171a" font-size="27" font-weight="800">复盘报告</text>
      <text x="24" y="118" fill="#626a74" font-size="16">逻辑与执行归因</text>
      <text x="24" y="148" fill="#626a74" font-size="16">假设库持续更新</text>
      <text x="24" y="178" fill="#626a74" font-size="16">错误档案沉淀</text>
      <rect x="24" y="218" width="172" height="34" rx="17" fill="#15171a"/>
      <text x="110" y="240" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">LEARN FROM THE RECORD</text>
    </g>

    <path d="M1010 500 C1010 590 188 590 188 500" fill="none" stroke="#c86bc1" stroke-width="3" stroke-dasharray="9 9"/>
    <path d="M188 500 l-9 15 h18 z" fill="#c86bc1"/>
    <text x="600" y="560" text-anchor="middle" fill="#15171a" font-size="18" font-weight="700">RESEARCH MEMORY COMPOUNDS OVER TIME</text>
    <text x="600" y="592" text-anchor="middle" fill="#7f8791" font-size="15">Daily reports · thesis library · counter-cases · mistake archive</text>

    <rect x="78" y="626" width="1042" height="1" fill="#d8dde3"/>
    <text x="78" y="654" fill="#7f8791" font-size="13">Designed for disciplined human judgment, with research evidence kept traceable across the full decision cycle.</text>
  </g>
</svg>
